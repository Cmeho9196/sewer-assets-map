<!DOCTYPE html>
<html>
<head>
<title>Utility Map</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
#map{
height:100vh;
}
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

var map = L.map('map').setView(
[35.512, -84.869],
13
);

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png'
).addTo(map);

L.marker([35.512,-84.869])
.addTo(map)
.bindPopup('Utility Asset');

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>Utility Map</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
#map{
height:100vh;
}
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  
<script src="https://unpkg.com/esri-leaflet@3.0.12/dist/esri-leaflet.js"></script>

<script>

var map = L.map('map').setView(
[35.512, -84.869],
13
);

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png'
).addTo(map);

var sewerLayer = L.esri.featureLayer({
    url: 'https://services8.arcgis.com/Dyz1RguVpLdByPmR/arcgis/rest/services/City_Of_Dayton_Sewer/FeatureServer/0'
}).addTo(map);

sewerLayer.once("load", function () {
    map.fitBounds(sewerLayer.getBounds());
});

});

</script>

</body>
</html>
